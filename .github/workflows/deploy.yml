name: Deploy Wordfall
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  VITE_BASE_PATH: /Wordfall/
  VITE_WORDFALL_ONLY: "true"
  VITE_LOVABLE_CONNECTOR_GOOGLE_ANALYTICS_API_KEY: ${{ vars.WORDFALL_GA_MEASUREMENT_ID }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import standalone game once
        if: ${{ hashFiles('package.json') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bootstrap.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Test game
        run: bun run test
      - name: Build game
        run: bun run build
      - name: Prepare static output
        run: |
          CLIENT_DIR=""
          for d in dist/client .output/public; do
            if [ -f "$d/index.html" ]; then CLIENT_DIR="$d"; break; fi
          done
          test -n "$CLIENT_DIR"
          cp "$CLIENT_DIR/index.html" "$CLIENT_DIR/404.html"
          touch "$CLIENT_DIR/.nojekyll"
          echo "CLIENT_DIR=$CLIENT_DIR" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.CLIENT_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
